name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress -Pbenchmarks -pl benchmarks -am package
        working-directory: java
      - run: |
          java -jar java/benchmarks/target/benchmarks.jar -t 1 -prof gc -rf json -rff java/benchmarks/target/jmh-1-thread.json
          java -jar java/benchmarks/target/benchmarks.jar -t 4 -prof gc -rf json -rff java/benchmarks/target/jmh-4-threads.json
      - uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: java/benchmarks/target/jmh-*.json
